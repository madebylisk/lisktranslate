[project]
name = "lisktranslate"
version = "0.1.0"
description = "Standalone on-screen OCR with regions and furigana."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
    "Pillow>=10",
    "numpy>=1.26",
    "oneocr>=1.0.12",
    "winocr>=0.0.15",
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
    "jamdict>=0.1a11",
]

[project.scripts]
lisktranslate = "lisktranslate.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lisktranslate*"]
